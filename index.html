<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=yes">
  <title>청소년상담사 2급 150제 CBT (문제 집중형 대화면)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              400: '#818cf8',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="data.js"></script>
  <style>
    /* 맑은 고딕(Malgun Gothic) 절대 우선 */
    *, *::before, *::after, body, button, input, select, textarea {
      font-family: 'Malgun Gothic', '맑은 고딕', 'Apple SD Gothic Neo', sans-serif !important;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    
    .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 4px; }
    
    /* 폰트 단계별 동적 크기 */
    .font-size-1 #qTitleText { font-size: 1.35rem; line-height: 1.65; }
    .font-size-1 .opt-text { font-size: 1.05rem; line-height: 1.6; }
    
    .font-size-2 #qTitleText { font-size: 1.6rem; line-height: 1.7; }
    .font-size-2 .opt-text { font-size: 1.2rem; line-height: 1.65; }
    
    .font-size-3 #qTitleText { font-size: 1.95rem; line-height: 1.75; font-weight: 800; }
    .font-size-3 .opt-text { font-size: 1.35rem; line-height: 1.7; font-weight: 600; }
    
    .font-size-4 #qTitleText { font-size: 2.35rem; line-height: 1.8; font-weight: 900; }
    .font-size-4 .opt-text { font-size: 1.55rem; line-height: 1.75; font-weight: 700; }
    
    .font-size-5 #qTitleText { font-size: 2.85rem; line-height: 1.85; font-weight: 900; }
    .font-size-5 .opt-text { font-size: 1.85rem; line-height: 1.8; font-weight: 800; }
  </style>
</head>
<body id="appBody" class="bg-black text-white min-h-screen flex flex-col font-size-3 selection:bg-brand-500 selection:text-white">

  <!-- SLIM TOP BAR (최소화된 상단 바로 세로 공간 극대화) -->
  <header class="bg-zinc-950/95 backdrop-blur border-b border-zinc-800/80 sticky top-0 z-40 px-4 py-2.5 shadow-md">
    <div class="max-w-6xl mx-auto flex items-center justify-between gap-3 flex-wrap">
      
      <!-- Session Switcher & Subject -->
      <div class="flex items-center gap-3">
        <select id="examSelect" onchange="changeExam(this.value)" class="text-xs sm:text-sm bg-zinc-900 border border-zinc-700 text-white font-bold rounded-lg px-3 py-1.5 focus:ring-2 focus:ring-brand-500 outline-none cursor-pointer">
        </select>
        <span id="subjectBadge" class="text-xs bg-brand-500/20 text-brand-300 border border-brand-500/30 font-bold px-2.5 py-1 rounded-md">
          과목 로딩중...
        </span>
      </div>

      <!-- Controls: Size / Mode / Audio -->
      <div class="flex items-center gap-2 flex-wrap">
        
        <!-- Font Size Controls (원터치 글씨 조절) -->
        <div class="flex items-center bg-zinc-900 border border-zinc-800 rounded-xl p-1 gap-1">
          <span class="text-xs text-zinc-400 font-bold px-1.5"><i class="fa-solid fa-text-height"></i></span>
          <button onclick="setZoomStep(1)" id="zBtn1" class="px-2 py-0.5 rounded-lg text-xs font-bold text-zinc-400 hover:text-white transition">작게</button>
          <button onclick="setZoomStep(2)" id="zBtn2" class="px-2 py-0.5 rounded-lg text-xs font-bold text-zinc-400 hover:text-white transition">보통</button>
          <button onclick="setZoomStep(3)" id="zBtn3" class="px-2.5 py-0.5 rounded-lg text-xs font-black bg-brand-600 text-white transition shadow-sm">크게 (기본)</button>
          <button onclick="setZoomStep(4)" id="zBtn4" class="px-2.5 py-0.5 rounded-lg text-xs font-bold text-zinc-400 hover:text-white transition">특대</button>
          <button onclick="setZoomStep(5)" id="zBtn5" class="px-2.5 py-0.5 rounded-lg text-xs font-bold text-zinc-400 hover:text-white transition">왕글씨</button>
        </div>

        <!-- Timer -->
        <div class="flex items-center gap-1.5 bg-zinc-900 border border-zinc-800 px-3 py-1.5 rounded-xl text-xs font-bold text-zinc-200">
          <i class="fa-regular fa-clock text-brand-400"></i>
          <span id="timerDisplay">00:00</span>
        </div>

        <!-- Mode Toggle (오답 / 전체) -->
        <div class="flex bg-zinc-900 border border-zinc-800 p-1 rounded-xl text-xs font-bold">
          <button onclick="setMode('study')" id="modeStudyBtn" class="px-3 py-1 rounded-lg bg-zinc-800 text-brand-400">1문제씩</button>
          <button onclick="setMode('wrong')" id="modeWrongBtn" class="px-3 py-1 rounded-lg text-zinc-400 hover:text-white">오답 (<span id="wrongCountNav">0</span>)</button>
        </div>

        <!-- Audio -->
        <button onclick="toggleSound()" id="soundBtn" class="w-8 h-8 rounded-xl bg-zinc-900 border border-zinc-800 hover:bg-zinc-800 text-zinc-200 flex items-center justify-center text-xs" title="효과음">
          <i class="fa-solid fa-volume-high"></i>
        </button>

      </div>

    </div>
  </header>

  <!-- SUBJECT NAV BAR (6개 과목 탭 바로가기) -->
  <nav class="bg-zinc-950/60 border-b border-zinc-900 px-4 py-2">
    <div class="max-w-6xl mx-auto flex items-center gap-1.5 overflow-x-auto custom-scroll" id="subjectTabs">
      <!-- Dynamic Subject Buttons -->
    </div>
  </nav>

  <!-- MAIN CONTAINER (문제에 100% 몰입하는 대화면 레이아웃) -->
  <main class="max-w-5xl mx-auto px-4 py-6 flex-1 flex flex-col gap-6 w-full">

    <!-- HERO QUESTION CARD (문제가 가장 잘 보이는 대형 카드) -->
    <div class="bg-zinc-950 border-2 border-zinc-800/90 rounded-3xl p-6 sm:p-8 shadow-2xl flex flex-col gap-6 relative">
      
      <!-- Top Meta Line -->
      <div class="flex items-center justify-between border-b border-zinc-800/80 pb-4">
        <div class="flex items-center gap-3">
          <span class="text-4xl sm:text-5xl font-black text-brand-400 tracking-tight" id="currentQNumText">Q.01</span>
          <div>
            <span class="text-xs font-extrabold uppercase tracking-wider text-zinc-400 block" id="qSubjCategory">청소년상담의 이론과 실제</span>
            <span class="text-xs font-bold text-zinc-400">진행률: <span id="answeredRatio">1 / 150</span>문항</span>
          </div>
        </div>

        <div class="flex items-center gap-4 text-xs sm:text-sm font-black">
          <span class="text-emerald-400 flex items-center gap-1"><i class="fa-solid fa-circle-check"></i> 정답 <span id="correctCountText">0</span></span>
          <span class="text-rose-400 flex items-center gap-1"><i class="fa-solid fa-circle-xmark"></i> 오답 <span id="wrongCountText">0</span></span>
          <span class="text-zinc-200 bg-zinc-900 px-2.5 py-1 rounded-lg border border-zinc-800">정답률 <span id="accuracyText">0</span>%</span>
          <button onclick="bookmarkQuestion()" id="bookmarkBtn" class="text-zinc-400 hover:text-amber-400 transition" title="북마크">
            <i class="fa-regular fa-star text-base"></i>
          </button>
        </div>
      </div>

      <!-- MAIN QUESTION TITLE (화면에서 가장 크고 선명하게 배치된 문제 텍스트) -->
      <div class="py-2">
        <h2 id="qTitleText" class="text-white font-black leading-snug tracking-tight text-left">
          문제를 불러오는 중입니다...
        </h2>
      </div>

      <!-- 5 INTERACTIVE OPTION CHOICE CARDS (보기 1~5 대형 터치 카드) -->
      <div id="optionsContainer" class="flex flex-col gap-3.5 pt-2">
        <!-- 5 choices rendered as large cards -->
      </div>

      <!-- EXPLANATION & FEEDBACK BANNER (정답 클릭 시 부드럽게 펼쳐지는 해설) -->
      <div id="feedbackBanner" class="hidden mt-4 p-5 sm:p-6 rounded-2xl flex flex-col gap-3.5 transition-all border shadow-2xl">
        <div class="flex items-center justify-between gap-3">
          <div class="flex items-center gap-3.5">
            <div id="feedbackIcon" class="w-12 h-12 rounded-2xl flex items-center justify-center text-2xl text-white font-black shadow-lg"></div>
            <div>
              <h3 id="feedbackTitle" class="font-black text-xl text-white"></h3>
              <p id="feedbackDesc" class="text-xs sm:text-sm text-zinc-300 font-semibold"></p>
            </div>
          </div>
          <button onclick="nextQuestion()" class="px-5 py-3 bg-white text-black font-black rounded-xl text-sm shadow-xl hover:bg-zinc-200 transition flex items-center gap-2 shrink-0">
            다음 문제 (Space) <i class="fa-solid fa-arrow-right"></i>
          </button>
        </div>

        <!-- Golden Key Explanation Box -->
        <div class="mt-2 pt-4 border-t border-zinc-700/60 bg-black/60 p-4 sm:p-5 rounded-2xl border border-amber-500/20">
          <div class="font-black text-amber-300 text-sm sm:text-base flex items-center gap-2 mb-2">
            <i class="fa-solid fa-lightbulb text-amber-400 text-lg"></i> 핵심 출제 포인트 및 정답 해설
          </div>
          <div id="explanationText" class="text-sm sm:text-base text-zinc-100 font-semibold leading-relaxed"></div>
        </div>
      </div>

      <!-- ACTION BAR -->
      <div class="pt-4 border-t border-zinc-800/80 flex items-center justify-between text-xs text-zinc-500 font-bold">
        <span><i class="fa-solid fa-keyboard"></i> 숫자키 1~5번으로 즉시 마킹 가능</span>
        <button onclick="toggleRevealAnswer()" class="text-brand-400 hover:text-brand-300 hover:underline text-sm font-black flex items-center gap-1.5">
          <i class="fa-regular fa-eye"></i> 정답 및 해설 바로 확인 (Enter)
        </button>
      </div>

    </div>

    <!-- BOTTOM NAVIGATION (이전 / 초기화 / 다음 버튼) -->
    <div class="flex items-center justify-between gap-4 py-2">
      <button onclick="prevQuestion()" class="px-6 py-3.5 bg-zinc-950 border-2 border-zinc-800 hover:border-zinc-700 rounded-2xl font-black text-base text-zinc-200 hover:text-white transition flex items-center gap-2.5 shadow-lg active:scale-95">
        <i class="fa-solid fa-arrow-left"></i> 이전 문제 (←)
      </button>
      
      <button onclick="resetCurrentExamProgress()" class="text-xs text-zinc-500 hover:text-rose-400 px-3 py-2 font-bold transition">
        <i class="fa-solid fa-trash-can"></i> 이 시험지 초기화
      </button>

      <button onclick="nextQuestion()" class="px-8 py-3.5 bg-brand-600 hover:bg-brand-500 text-white rounded-2xl font-black text-base shadow-xl transition flex items-center gap-2.5 active:scale-95">
        다음 문제 (→) <i class="fa-solid fa-arrow-right"></i>
      </button>
    </div>

    <!-- OMR 150제 DRAWER / GRID (접었다 폈다 할 수 있는 깔끔한 하단 네비게이터) -->
    <div class="bg-zinc-950 border border-zinc-800/90 rounded-3xl p-5 shadow-xl">
      <div class="flex items-center justify-between pb-3 border-b border-zinc-800 mb-3.5">
        <h4 class="font-black text-sm text-zinc-200 flex items-center gap-2">
          <i class="fa-solid fa-table-cells text-brand-400"></i> OMR 150문항 맵 (클릭 시 해당 문제로 즉시 이동)
        </h4>
        <span class="text-xs text-zinc-400 font-bold" id="omrStatsBadge">0 / 150 완료</span>
      </div>
      
      <div id="omrGrid" class="grid grid-cols-10 sm:grid-cols-15 md:grid-cols-25 gap-1.5 max-h-48 overflow-y-auto custom-scroll p-1">
        <!-- 150 small buttons -->
      </div>
    </div>

  </main>

  <!-- JAVASCRIPT LOGIC ENGINE -->
  <script>
    let currentExamId = "mock_1";
    let currentQIndex = 0;
    let currentMode = "study";
    let zoomStep = parseInt(localStorage.getItem("cbt_zoom_hero_step") || "3"); // 1..5 (Default 3: 크게)
    let soundEnabled = true;
    let timerSeconds = 0;
    let timerInterval = null;
    let timerPaused = false;
    let activeSubjectFilter = "ALL";

    let userState = JSON.parse(localStorage.getItem("cbt_user_state_mock") || "{}");

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(isCorrect) {
      if (!soundEnabled) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        
        if (isCorrect) {
          osc.type = "sine";
          osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
          osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1);
          gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.35);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.35);
        } else {
          osc.type = "sawtooth";
          osc.frequency.setValueAtTime(180, audioCtx.currentTime);
          gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.25);
        }
      } catch (e) {}
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      const btn = document.getElementById("soundBtn");
      btn.innerHTML = soundEnabled ? '<i class="fa-solid fa-volume-high"></i>' : '<i class="fa-solid fa-volume-xmark text-rose-500"></i>';
    }

    function setZoomStep(step) {
      zoomStep = Math.min(Math.max(1, step), 5);
      localStorage.setItem("cbt_zoom_hero_step", zoomStep);
      
      const body = document.getElementById("appBody");
      body.className = `bg-black text-white min-h-screen flex flex-col font-size-${zoomStep} selection:bg-brand-500 selection:text-white`;

      [1, 2, 3, 4, 5].forEach(p => {
        const btn = document.getElementById(`zBtn${p}`);
        if (btn) {
          if (zoomStep === p) {
            btn.className = "px-2.5 py-0.5 rounded-lg text-xs font-black bg-brand-600 text-white transition shadow-sm";
          } else {
            btn.className = "px-2 py-0.5 rounded-lg text-xs font-bold text-zinc-400 hover:text-white transition";
          }
        }
      });
    }

    function startTimer() {
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        if (!timerPaused) {
          timerSeconds++;
          const mins = String(Math.floor(timerSeconds / 60)).padStart(2, '0');
          const secs = String(timerSeconds % 60).padStart(2, '0');
          document.getElementById("timerDisplay").textContent = `${mins}:${secs}`;
        }
      }, 1000);
    }

    window.addEventListener("DOMContentLoaded", () => {
      populateExamSelect();
      loadExam(currentExamId);
      setZoomStep(zoomStep);
      startTimer();
      setupKeyboardShortcuts();
    });

    function populateExamSelect() {
      const select = document.getElementById("examSelect");
      select.innerHTML = "";
      if (!window.EXAM_DATA) return;
      Object.keys(window.EXAM_DATA).forEach(id => {
        const opt = document.createElement("option");
        opt.value = id;
        opt.textContent = window.EXAM_DATA[id].title;
        select.appendChild(opt);
      });
      select.value = currentExamId;
    }

    function changeExam(examId) {
      currentExamId = examId;
      currentQIndex = 0;
      activeSubjectFilter = "ALL";
      loadExam(examId);
    }

    function getCurrentExam() {
      return window.EXAM_DATA ? window.EXAM_DATA[currentExamId] : null;
    }

    function getFilteredQuestions() {
      const exam = getCurrentExam();
      if (!exam) return [];
      
      let list = exam.questions;
      if (activeSubjectFilter !== "ALL") {
        list = list.filter(q => q.subject.includes(activeSubjectFilter));
      }
      
      if (currentMode === "wrong") {
        const examState = userState[currentExamId]?.answers || {};
        list = list.filter(q => examState[q.q_num] && !examState[q.q_num].isCorrect);
      }
      return list;
    }

    function loadExam(examId) {
      const exam = getCurrentExam();
      if (!exam) return;

      if (!userState[examId]) {
        userState[examId] = { answers: {}, bookmarks: [] };
      }

      renderSubjectTabs();
      renderQuestion();
      renderOMRGrid();
      updateStats();
    }

    function renderSubjectTabs() {
      const exam = getCurrentExam();
      const container = document.getElementById("subjectTabs");
      container.innerHTML = "";
      
      const allBtn = document.createElement("button");
      allBtn.className = `text-xs px-3.5 py-1.5 rounded-xl font-bold whitespace-nowrap transition ${activeSubjectFilter === 'ALL' ? 'bg-brand-600 text-white shadow-md' : 'bg-zinc-900 border border-zinc-800 text-zinc-400 hover:text-white'}`;
      allBtn.textContent = "전체 150문항";
      allBtn.onclick = () => { activeSubjectFilter = "ALL"; renderSubjectTabs(); renderOMRGrid(); renderQuestion(); };
      container.appendChild(allBtn);

      exam.subjects.forEach((sub, sIdx) => {
        const shortName = sub.split(" ")[0];
        const btn = document.createElement("button");
        btn.className = `text-xs px-3 py-1.5 rounded-xl font-bold whitespace-nowrap transition ${activeSubjectFilter === shortName ? 'bg-brand-600 text-white shadow-md' : 'bg-zinc-900 border border-zinc-800 text-zinc-400 hover:text-white'}`;
        btn.textContent = `${sIdx + 1}. ${shortName}`;
        btn.onclick = () => { activeSubjectFilter = shortName; renderSubjectTabs(); renderOMRGrid(); renderQuestion(); };
        container.appendChild(btn);
      });
    }

    function renderQuestion() {
      const qList = getFilteredQuestions();
      if (qList.length === 0) {
        document.getElementById("currentQNumText").textContent = "-";
        document.getElementById("qTitleText").textContent = currentMode === 'wrong' ? "틀린 문제가 없습니다! 🎉 만점입니다!" : "문항이 없습니다.";
        document.getElementById("optionsContainer").innerHTML = "";
        document.getElementById("feedbackBanner").classList.add("hidden");
        document.getElementById("qSubjCategory").textContent = "완료";
        return;
      }

      if (currentQIndex >= qList.length) currentQIndex = qList.length - 1;
      if (currentQIndex < 0) currentQIndex = 0;

      const q = qList[currentQIndex];

      document.getElementById("currentQNumText").textContent = `Q.${String(q.q_num).padStart(2, '0')}`;
      document.getElementById("qSubjCategory").textContent = q.subject;
      document.getElementById("subjectBadge").textContent = q.subject;

      // Question Title
      const titleElem = document.getElementById("qTitleText");
      titleElem.textContent = q.title.replace(/^\[.*?\]\s*/, '');

      // Bookmark
      const isBookmarked = (userState[currentExamId]?.bookmarks || []).includes(q.q_num);
      const bmBtn = document.getElementById("bookmarkBtn");
      bmBtn.innerHTML = isBookmarked ? '<i class="fa-solid fa-star text-amber-400 text-lg"></i>' : '<i class="fa-regular fa-star text-lg"></i>';

      // Render 5 Option Cards
      const optionsContainer = document.getElementById("optionsContainer");
      optionsContainer.innerHTML = "";

      const saved = userState[currentExamId]?.answers[q.q_num];
      const banner = document.getElementById("feedbackBanner");
      const optIcons = ["①", "②", "③", "④", "⑤"];

      q.options.forEach((optText, optIdx) => {
        const optNum = optIdx + 1;
        const btn = document.createElement("div");
        
        let borderClass = "border-zinc-800/90 bg-zinc-900/80 text-zinc-100 hover:border-brand-500 hover:bg-brand-950/40";
        let numBg = "bg-zinc-800 text-zinc-300";

        if (saved) {
          if (optNum === saved.selected) {
            if (saved.isCorrect) {
              borderClass = "border-emerald-500 bg-emerald-950/70 text-emerald-200 ring-2 ring-emerald-500/50 shadow-xl";
              numBg = "bg-emerald-500 text-white font-black";
            } else {
              borderClass = "border-rose-500 bg-rose-950/70 text-rose-200 ring-2 ring-rose-500/50 shadow-xl";
              numBg = "bg-rose-500 text-white font-black";
            }
          } else if (optNum === q.ans) {
            borderClass = "border-emerald-500 bg-emerald-950/50 text-emerald-200";
            numBg = "bg-emerald-500 text-white font-black";
          }
        }

        btn.className = `p-4 sm:p-5 rounded-2xl border-2 transition-all cursor-pointer flex items-start gap-4 shadow-md active:scale-[0.99] ${borderClass}`;
        btn.innerHTML = `
          <span class="w-9 h-9 sm:w-10 sm:h-10 rounded-xl flex items-center justify-center text-lg sm:text-xl font-black shrink-0 ${numBg}">${optIcons[optIdx]}</span>
          <span class="flex-1 opt-text pt-1 font-semibold leading-relaxed">${optText}</span>
        `;
        btn.onclick = () => selectOption(optNum);
        optionsContainer.appendChild(btn);
      });

      if (saved) {
        showFeedback(saved.isCorrect, q.ans, q.exp);
      } else {
        banner.classList.add("hidden");
      }

      renderOMRGrid();
      updateStats();
    }

    function selectOption(optNum) {
      const qList = getFilteredQuestions();
      if (qList.length === 0) return;
      const q = qList[currentQIndex];

      const isCorrect = (optNum === q.ans);

      if (!userState[currentExamId]) userState[currentExamId] = { answers: {}, bookmarks: [] };
      userState[currentExamId].answers[q.q_num] = {
        selected: optNum,
        isCorrect: isCorrect
      };
      localStorage.setItem("cbt_user_state_mock", JSON.stringify(userState));

      playBeep(isCorrect);
      renderQuestion();
    }

    function showFeedback(isCorrect, ansNum, explanation) {
      const banner = document.getElementById("feedbackBanner");
      const icon = document.getElementById("feedbackIcon");
      const title = document.getElementById("feedbackTitle");
      const desc = document.getElementById("feedbackDesc");
      const expText = document.getElementById("explanationText");

      banner.classList.remove("hidden");
      expText.textContent = explanation || "해당 이론의 핵심 출제 개념을 다시 한번 복습하세요.";

      if (isCorrect) {
        banner.className = "mt-6 p-5 sm:p-6 rounded-2xl flex flex-col gap-3.5 transition-all bg-emerald-950/80 border-2 border-emerald-700 text-emerald-100 shadow-2xl";
        icon.className = "w-12 h-12 rounded-2xl flex items-center justify-center text-2xl bg-emerald-500 text-white font-black shadow-lg";
        icon.innerHTML = '<i class="fa-solid fa-check"></i>';
        title.textContent = "정답입니다! 🎉";
        desc.textContent = "정확하게 정답을 맞추셨습니다! 다음 문제로 이동하세요.";
      } else {
        banner.className = "mt-6 p-5 sm:p-6 rounded-2xl flex flex-col gap-3.5 transition-all bg-rose-950/80 border-2 border-rose-700 text-rose-100 shadow-2xl";
        icon.className = "w-12 h-12 rounded-2xl flex items-center justify-center text-2xl bg-rose-500 text-white font-black shadow-lg";
        icon.innerHTML = '<i class="fa-solid fa-xmark"></i>';
        title.textContent = `오답입니다 (정답: ${ansNum}번)`;
        desc.textContent = "틀린 문제는 오답노트에 자동 등록되었습니다.";
      }
    }

    function toggleRevealAnswer() {
      const qList = getFilteredQuestions();
      if (qList.length === 0) return;
      const q = qList[currentQIndex];
      selectOption(q.ans);
    }

    function prevQuestion() {
      if (currentQIndex > 0) {
        currentQIndex--;
        renderQuestion();
      }
    }

    function nextQuestion() {
      const qList = getFilteredQuestions();
      if (currentQIndex < qList.length - 1) {
        currentQIndex++;
        renderQuestion();
      }
    }

    function jumpToQuestion(idx) {
      currentQIndex = idx;
      renderQuestion();
    }

    function bookmarkQuestion() {
      const qList = getFilteredQuestions();
      if (qList.length === 0) return;
      const q = qList[currentQIndex];

      if (!userState[currentExamId].bookmarks) userState[currentExamId].bookmarks = [];
      const bm = userState[currentExamId].bookmarks;
      const idx = bm.indexOf(q.q_num);
      if (idx >= 0) bm.splice(idx, 1);
      else bm.push(q.q_num);

      localStorage.setItem("cbt_user_state_mock", JSON.stringify(userState));
      renderQuestion();
    }

    function renderOMRGrid() {
      const grid = document.getElementById("omrGrid");
      grid.innerHTML = "";
      const qList = getFilteredQuestions();
      const examState = userState[currentExamId]?.answers || {};

      qList.forEach((q, idx) => {
        const btn = document.createElement("button");
        const isCurrent = (idx === currentQIndex);
        const ansInfo = examState[q.q_num];

        let bgClass = "bg-zinc-900 border border-zinc-800 text-zinc-400 hover:bg-zinc-800";
        if (ansInfo) {
          bgClass = ansInfo.isCorrect ? "bg-emerald-600 text-white font-bold border-emerald-500 shadow-sm" : "bg-rose-600 text-white font-bold border-rose-500 shadow-sm";
        }
        if (isCurrent) {
          bgClass += " ring-2 ring-brand-400 scale-105 font-black text-white";
        }

        btn.className = `py-1.5 rounded-lg text-xs font-bold transition flex items-center justify-center ${bgClass}`;
        btn.textContent = q.q_num;
        btn.onclick = () => jumpToQuestion(idx);
        grid.appendChild(btn);
      });

      const answeredCount = Object.keys(examState).length;
      document.getElementById("answeredRatio").textContent = `${answeredCount} / ${qList.length}`;
      document.getElementById("omrStatsBadge").textContent = `${answeredCount} / ${qList.length} 완료`;
    }

    function updateStats() {
      const exam = getCurrentExam();
      if (!exam) return;
      const examState = userState[currentExamId]?.answers || {};
      const answeredKeys = Object.keys(examState);
      const totalAnswered = answeredKeys.length;
      
      let correct = 0;
      let wrong = 0;
      answeredKeys.forEach(k => {
        if (examState[k].isCorrect) correct++;
        else wrong++;
      });

      document.getElementById("correctCountText").textContent = correct;
      document.getElementById("wrongCountText").textContent = wrong;
      document.getElementById("wrongCountNav").textContent = wrong;

      const acc = totalAnswered > 0 ? Math.round((correct / totalAnswered) * 100) : 0;
      document.getElementById("accuracyText").textContent = acc;
    }

    function setMode(mode) {
      currentMode = mode;
      currentQIndex = 0;

      const sBtn = document.getElementById("modeStudyBtn");
      const wBtn = document.getElementById("modeWrongBtn");

      if (mode === 'study') {
        sBtn.className = "px-3 py-1 rounded-lg bg-zinc-800 text-brand-400";
        wBtn.className = "px-3 py-1 rounded-lg text-zinc-400 hover:text-white";
      } else {
        wBtn.className = "px-3 py-1 rounded-lg bg-zinc-800 text-brand-400";
        sBtn.className = "px-3 py-1 rounded-lg text-zinc-400 hover:text-white";
      }

      renderQuestion();
    }

    function resetCurrentExamProgress() {
      if (confirm("정말로 현재 시험지의 모든 풀이 기록을 초기화하시겠습니까?")) {
        userState[currentExamId] = { answers: {}, bookmarks: [] };
        localStorage.setItem("cbt_user_state_mock", JSON.stringify(userState));
        currentQIndex = 0;
        renderQuestion();
      }
    }

    function setupKeyboardShortcuts() {
      window.addEventListener("keydown", (e) => {
        if (['INPUT', 'SELECT', 'TEXTAREA'].includes(e.target.tagName)) return;

        if (e.key >= '1' && e.key <= '5') {
          selectOption(parseInt(e.key));
        } else if (e.key === 'ArrowRight' || e.key === ' ' || e.code === 'Space') {
          e.preventDefault();
          nextQuestion();
        } else if (e.key === 'ArrowLeft') {
          e.preventDefault();
          prevQuestion();
        } else if (e.key === 'Enter') {
          e.preventDefault();
          toggleRevealAnswer();
        } else if (e.key === '+' || e.key === '=') {
          setZoomStep(zoomStep + 1);
        } else if (e.key === '-' || e.key === '_') {
          setZoomStep(zoomStep - 1);
        }
      });
    }
  </script>
</body>
</html>

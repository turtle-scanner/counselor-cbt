<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=yes">
  <title>청소년상담사 2급 150제 CBT (특대형 맑은 고딕)</title>
  <script src="data.js?v=2027"></script>
  <style>
    /* 맑은 고딕(Malgun Gothic) 100% 강제 적용 */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Malgun Gothic', '맑은 고딕', 'Apple SD Gothic Neo', sans-serif !important;
      -webkit-font-smoothing: antialiased;
    }
    
    body {
      background-color: #000000;
      color: #FFFFFF;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-bottom: 60px;
    }

    /* Top Bar */
    header {
      background-color: #09090b;
      border-bottom: 1px solid #27272a;
      position: sticky;
      top: 0;
      z-index: 50;
      padding: 12px 16px;
    }
    .header-container {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
    }

    /* Select box */
    select {
      background-color: #18181b;
      color: #FFFFFF;
      border: 1px solid #3f3f46;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 15px;
      font-weight: bold;
      outline: none;
      cursor: pointer;
    }

    /* Subject Nav */
    .subj-nav {
      background-color: #09090b;
      border-bottom: 1px solid #18181b;
      padding: 8px 16px;
      overflow-x: auto;
      white-space: nowrap;
    }
    .subj-nav-inner {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      gap: 8px;
    }
    .subj-btn {
      background-color: #18181b;
      color: #a1a1aa;
      border: 1px solid #27272a;
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.15s;
    }
    .subj-btn.active {
      background-color: #4f46e5;
      color: #FFFFFF;
      border-color: #6366f1;
    }

    /* Main Container */
    main {
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Size Controls */
    .size-toolbar {
      background-color: #09090b;
      border: 1px solid #27272a;
      border-radius: 14px;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
    }
    .size-btn-group {
      display: flex;
      gap: 6px;
    }
    .size-btn {
      background-color: #18181b;
      color: #a1a1aa;
      border: 1px solid #27272a;
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
    }
    .size-btn.active {
      background-color: #4f46e5;
      color: #FFFFFF;
      border-color: #6366f1;
    }

    /* Hero Question Box */
    .question-card {
      background-color: #09090b;
      border: 2px solid #27272a;
      border-radius: 20px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    /* Question Header */
    .q-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #27272a;
      padding-bottom: 12px;
    }
    .q-num-badge {
      font-size: 32px;
      font-weight: 900;
      color: #818cf8;
      letter-spacing: -1px;
    }
    .q-subj-title {
      font-size: 15px;
      font-weight: bold;
      color: #e4e4e7;
    }
    .q-score-box {
      display: flex;
      gap: 12px;
      font-size: 14px;
      font-weight: bold;
    }

    /* The Massive Question Title */
    .q-title {
      color: #FFFFFF;
      font-weight: 800;
      line-height: 1.6;
      word-break: keep-all;
      letter-spacing: -0.5px;
    }

    /* 5 Options List */
    .options-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .option-card {
      background-color: #18181b;
      border: 2px solid #27272a;
      border-radius: 16px;
      padding: 16px 20px;
      display: flex;
      align-items: flex-start;
      gap: 14px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .option-card:hover {
      border-color: #6366f1;
      background-color: #1e1b4b;
    }
    .option-card:active {
      transform: scale(0.99);
    }
    .opt-badge {
      background-color: #27272a;
      color: #FFFFFF;
      width: 38px;
      height: 38px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 900;
      flex-shrink: 0;
    }
    .opt-text {
      color: #f4f4f5;
      font-weight: 600;
      line-height: 1.6;
      padding-top: 4px;
      word-break: keep-all;
    }

    /* Correct / Incorrect Highlights */
    .option-card.correct {
      background-color: rgba(6, 78, 59, 0.7) !important;
      border-color: #10b981 !important;
      box-shadow: 0 0 15px rgba(16, 185, 129, 0.3);
    }
    .option-card.correct .opt-badge {
      background-color: #10b981 !important;
      color: #FFFFFF !important;
    }
    .option-card.wrong {
      background-color: rgba(136, 19, 55, 0.7) !important;
      border-color: #f43f5e !important;
      box-shadow: 0 0 15px rgba(244, 63, 94, 0.3);
    }
    .option-card.wrong .opt-badge {
      background-color: #f43f5e !important;
      color: #FFFFFF !important;
    }

    /* Feedback & Explanation Box */
    .feedback-box {
      background-color: #18181b;
      border: 2px solid #3f3f46;
      border-radius: 16px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 10px;
    }
    .feedback-box.correct-box {
      border-color: #10b981;
      background-color: rgba(6, 78, 59, 0.3);
    }
    .feedback-box.wrong-box {
      border-color: #f43f5e;
      background-color: rgba(136, 19, 55, 0.3);
    }
    .exp-content {
      background-color: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(245, 158, 11, 0.3);
      border-radius: 12px;
      padding: 14px;
      color: #fef08a;
      font-size: 16px;
      line-height: 1.65;
    }

    /* Bottom Navigation */
    .bottom-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .nav-btn {
      background-color: #18181b;
      color: #FFFFFF;
      border: 1px solid #3f3f46;
      border-radius: 12px;
      padding: 14px 24px;
      font-size: 16px;
      font-weight: 900;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.15s;
    }
    .nav-btn:hover {
      background-color: #27272a;
    }
    .nav-btn.primary {
      background-color: #4f46e5;
      border-color: #6366f1;
    }
    .nav-btn.primary:hover {
      background-color: #4338ca;
    }

    /* OMR Drawer */
    .omr-drawer {
      background-color: #09090b;
      border: 1px solid #27272a;
      border-radius: 16px;
      padding: 16px;
    }
    .omr-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(36px, 1fr));
      gap: 6px;
      max-height: 200px;
      overflow-y: auto;
      padding: 4px;
    }
    .omr-cell {
      background-color: #18181b;
      color: #a1a1aa;
      border: 1px solid #27272a;
      border-radius: 6px;
      padding: 6px 0;
      text-align: center;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }
    .omr-cell.current {
      border-color: #818cf8;
      color: #FFFFFF;
      background-color: #312e81;
    }
    .omr-cell.correct {
      background-color: #059669;
      color: #FFFFFF;
      border-color: #10b981;
    }
    .omr-cell.wrong {
      background-color: #e11d48;
      color: #FFFFFF;
      border-color: #f43f5e;
    }

    /* Font Size Presets (CSS Classes) */
    .size-step-1 .q-title { font-size: 18px; }
    .size-step-1 .opt-text { font-size: 15px; }

    .size-step-2 .q-title { font-size: 22px; }
    .size-step-2 .opt-text { font-size: 17px; }

    .size-step-3 .q-title { font-size: 26px; }
    .size-step-3 .opt-text { font-size: 19px; }

    .size-step-4 .q-title { font-size: 32px; }
    .size-step-4 .opt-text { font-size: 22px; }

    .size-step-5 .q-title { font-size: 38px; }
    .size-step-5 .opt-text { font-size: 26px; }
  </style>
</head>
<body id="appBody" class="size-step-3">

  <!-- TOP BAR -->
  <header>
    <div class="header-container">
      <div style="display: flex; align-items: center; gap: 10px;">
        <span style="background: #4f46e5; padding: 6px 10px; border-radius: 8px; font-weight: 900; font-size: 14px;">청소년상담사 2급</span>
        <select id="examSelect" onchange="changeExam(this.value)">
        </select>
      </div>
      <div style="display: flex; align-items: center; gap: 10px;">
        <span id="timerDisplay" style="background: #18181b; padding: 6px 12px; border-radius: 8px; font-weight: bold; font-size: 14px; border: 1px solid #27272a;">⏱️ 00:00</span>
        <button onclick="toggleMode()" id="modeBtn" style="background: #18181b; color: #818cf8; border: 1px solid #27272a; padding: 6px 12px; border-radius: 8px; font-weight: bold; font-size: 13px; cursor: pointer;">1문제씩 풀기</button>
      </div>
    </div>
  </header>

  <!-- SUBJECT NAV TABS -->
  <nav class="subj-nav">
    <div class="subj-nav-inner" id="subjectTabs">
    </div>
  </nav>

  <!-- MAIN VIEW -->
  <main>
    
    <!-- SIZE TOOLBAR -->
    <div class="size-toolbar">
      <div style="display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: bold;">
        <span>🔍 글씨 크기 조절:</span>
      </div>
      <div class="size-btn-group">
        <button class="size-btn" onclick="setSizeStep(1)" id="sBtn1">작게</button>
        <button class="size-btn" onclick="setSizeStep(2)" id="sBtn2">보통</button>
        <button class="size-btn active" onclick="setSizeStep(3)" id="sBtn3">크게 (추천)</button>
        <button class="size-btn" onclick="setSizeStep(4)" id="sBtn4">특대형</button>
        <button class="size-btn" onclick="setSizeStep(5)" id="sBtn5">왕글씨 (최대)</button>
      </div>
    </div>

    <!-- HERO QUESTION CARD -->
    <div class="question-card">
      
      <!-- Meta -->
      <div class="q-meta">
        <div>
          <div class="q-num-badge" id="qNumBadge">Q.01</div>
          <div class="q-subj-title" id="qSubjTitle">청소년상담의 이론과 실제</div>
        </div>
        <div class="q-score-box">
          <span style="color: #34d399;">정답 <b id="correctCountText">0</b></span>
          <span style="color: #fb7185;">오답 <b id="wrongCountText">0</b></span>
          <span style="color: #a1a1aa;">진행률 <b id="progressText">1/150</b></span>
        </div>
      </div>

      <!-- Question Text (HUGE) -->
      <div class="q-title" id="qTitleText">
        문제를 불러오는 중입니다...
      </div>

      <!-- 5 Option Cards -->
      <div class="options-list" id="optionsContainer">
      </div>

      <!-- Feedback / Explanation -->
      <div id="feedbackBanner" class="feedback-box" style="display: none;">
        <div style="display: flex; align-items: center; justify-content: space-between;">
          <div id="feedbackTitle" style="font-size: 20px; font-weight: 900;"></div>
          <button onclick="nextQuestion()" class="nav-btn primary" style="padding: 10px 18px; font-size: 14px;">다음 문제 (Space) ▶</button>
        </div>
        <div class="exp-content">
          <div style="font-weight: 900; margin-bottom: 6px;">💡 핵심 출제 포인트 & 정답 해설:</div>
          <div id="explanationText"></div>
        </div>
      </div>

      <!-- Footer action -->
      <div style="display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #27272a; padding-top: 14px; font-size: 13px; color: #71717a; font-weight: bold;">
        <span>키보드 1~5번으로 마킹 가능</span>
        <button onclick="toggleRevealAnswer()" style="background: none; border: none; color: #818cf8; font-size: 14px; font-weight: 900; cursor: pointer;">정답/해설 바로 확인 (Enter)</button>
      </div>

    </div>

    <!-- BOTTOM NAV BUTTONS -->
    <div class="bottom-nav">
      <button onclick="prevQuestion()" class="nav-btn">◀ 이전 문제 (←)</button>
      <button onclick="resetExamProgress()" style="background: none; border: none; color: #71717a; font-size: 13px; cursor: pointer; font-weight: bold;">기록 초기화</button>
      <button onclick="nextQuestion()" class="nav-btn primary">다음 문제 (→) ▶</button>
    </div>

    <!-- OMR 150 MAP -->
    <div class="omr-drawer">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 14px; font-weight: bold;">
        <span>📋 OMR 150문항 맵 (클릭 시 이동)</span>
        <span id="omrCountBadge" style="color: #a1a1aa; font-size: 12px;">0/150 완료</span>
      </div>
      <div class="omr-grid" id="omrGrid">
      </div>
    </div>

  </main>

  <!-- JAVASCRIPT ENGINE -->
  <script>
    let currentExamId = "mock_1";
    let currentQIndex = 0;
    let currentMode = "study"; // 'study', 'wrong'
    let sizeStep = parseInt(localStorage.getItem("cbt_pure_size_step") || "3");
    let timerSeconds = 0;
    let timerInterval = null;
    let activeSubjectFilter = "ALL";

    let userState = JSON.parse(localStorage.getItem("cbt_user_state_pure_v2") || "{}");

    // Sound Synthesis (Web Audio API)
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(isCorrect) {
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        if (isCorrect) {
          osc.type = "sine";
          osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
          osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1);
          gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.35);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.35);
        } else {
          osc.type = "sawtooth";
          osc.frequency.setValueAtTime(180, audioCtx.currentTime);
          gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.25);
        }
      } catch (e) {}
    }

    function setSizeStep(step) {
      sizeStep = Math.min(Math.max(1, step), 5);
      localStorage.setItem("cbt_pure_size_step", sizeStep);
      document.getElementById("appBody").className = `size-step-${sizeStep}`;

      [1, 2, 3, 4, 5].forEach(i => {
        const btn = document.getElementById(`sBtn${i}`);
        if (btn) btn.className = (i === sizeStep) ? "size-btn active" : "size-btn";
      });
    }

    function startTimer() {
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        timerSeconds++;
        const mins = String(Math.floor(timerSeconds / 60)).padStart(2, '0');
        const secs = String(timerSeconds % 60).padStart(2, '0');
        document.getElementById("timerDisplay").textContent = `⏱️ ${mins}:${secs}`;
      }, 1000);
    }

    window.addEventListener("DOMContentLoaded", () => {
      populateExamSelect();
      loadExam(currentExamId);
      setSizeStep(sizeStep);
      startTimer();
      setupKeyboardShortcuts();
    });

    function populateExamSelect() {
      const select = document.getElementById("examSelect");
      select.innerHTML = "";
      if (!window.EXAM_DATA) return;
      Object.keys(window.EXAM_DATA).forEach(id => {
        const opt = document.createElement("option");
        opt.value = id;
        opt.textContent = window.EXAM_DATA[id].title;
        select.appendChild(opt);
      });
      select.value = currentExamId;
    }

    function changeExam(examId) {
      currentExamId = examId;
      currentQIndex = 0;
      activeSubjectFilter = "ALL";
      loadExam(examId);
    }

    function getCurrentExam() {
      return window.EXAM_DATA ? window.EXAM_DATA[currentExamId] : null;
    }

    function getFilteredQuestions() {
      const exam = getCurrentExam();
      if (!exam) return [];
      let list = exam.questions;
      if (activeSubjectFilter !== "ALL") {
        list = list.filter(q => q.subject.includes(activeSubjectFilter));
      }
      if (currentMode === "wrong") {
        const examState = userState[currentExamId]?.answers || {};
        list = list.filter(q => examState[q.q_num] && !examState[q.q_num].isCorrect);
      }
      return list;
    }

    function loadExam(examId) {
      const exam = getCurrentExam();
      if (!exam) return;

      if (!userState[examId]) {
        userState[examId] = { answers: {} };
      }

      renderSubjectTabs();
      renderQuestion();
      renderOMRGrid();
      updateStats();
    }

    function renderSubjectTabs() {
      const exam = getCurrentExam();
      const container = document.getElementById("subjectTabs");
      container.innerHTML = "";
      
      const allBtn = document.createElement("button");
      allBtn.className = (activeSubjectFilter === 'ALL') ? "subj-btn active" : "subj-btn";
      allBtn.textContent = "전체 150문항";
      allBtn.onclick = () => { activeSubjectFilter = "ALL"; renderSubjectTabs(); renderOMRGrid(); renderQuestion(); };
      container.appendChild(allBtn);

      exam.subjects.forEach((sub, sIdx) => {
        const shortName = sub.split(" ")[0];
        const btn = document.createElement("button");
        btn.className = (activeSubjectFilter === shortName) ? "subj-btn active" : "subj-btn";
        btn.textContent = `${sIdx + 1}. ${shortName}`;
        btn.onclick = () => { activeSubjectFilter = shortName; renderSubjectTabs(); renderOMRGrid(); renderQuestion(); };
        container.appendChild(btn);
      });
    }

    function highlightKeywords(text) {
      if (!text) return "";
      let clean = text.replace(/^\[.*?\]\s*/, '');
      clean = clean.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      
      // 부정형/반대 질문 키워드 노란색 강조 (사용자 요청: '않은' 노란색 표시)
      const highlightRegex = /(옳지\s*않은|적절하지\s*않은|포함되지\s*않은|해당하지\s*않은|알맞지\s*않은|바르지\s*않은|틀린|아닌|부적절한|거리가\s*먼|않은)/g;
      return clean.replace(highlightRegex, '<span style="color: #facc15; font-weight: 900; text-decoration: underline; text-underline-offset: 4px; padding: 0 2px;">$1</span>');
    }

    function renderQuestion() {
      const qList = getFilteredQuestions();
      if (qList.length === 0) {
        document.getElementById("qNumBadge").textContent = "-";
        document.getElementById("qTitleText").textContent = (currentMode === 'wrong') ? "오답이 없습니다! 🎉 만점입니다!" : "문항이 없습니다.";
        document.getElementById("optionsContainer").innerHTML = "";
        document.getElementById("feedbackBanner").style.display = "none";
        document.getElementById("qSubjTitle").textContent = "완료";
        return;
      }

      if (currentQIndex >= qList.length) currentQIndex = qList.length - 1;
      if (currentQIndex < 0) currentQIndex = 0;

      const q = qList[currentQIndex];

      document.getElementById("qNumBadge").textContent = `Q.${String(q.q_num).padStart(2, '0')}`;
      document.getElementById("qSubjTitle").textContent = q.subject;
      document.getElementById("progressText").textContent = `${q.q_num} / ${qList.length}`;

      // Title (With Yellow Highlight on '않은')
      document.getElementById("qTitleText").innerHTML = highlightKeywords(q.title);

      // Options
      const optionsContainer = document.getElementById("optionsContainer");
      optionsContainer.innerHTML = "";

      const saved = userState[currentExamId]?.answers[q.q_num];
      const banner = document.getElementById("feedbackBanner");
      const optIcons = ["①", "②", "③", "④", "⑤"];

      q.options.forEach((optText, optIdx) => {
        const optNum = optIdx + 1;
        const btn = document.createElement("div");
        let cls = "option-card";

        if (saved) {
          if (optNum === saved.selected) {
            cls += saved.isCorrect ? " correct" : " wrong";
          } else if (optNum === q.ans) {
            cls += " correct";
          }
        }

        btn.className = cls;
        btn.innerHTML = `
          <div class="opt-badge">${optIcons[optIdx]}</div>
          <div class="opt-text">${optText}</div>
        `;
        btn.onclick = () => selectOption(optNum);
        optionsContainer.appendChild(btn);
      });

      if (saved) {
        showFeedback(saved.isCorrect, q.ans, q.exp);
      } else {
        banner.style.display = "none";
      }

      renderOMRGrid();
      updateStats();
    }

    function selectOption(optNum) {
      const qList = getFilteredQuestions();
      if (qList.length === 0) return;
      const q = qList[currentQIndex];

      const isCorrect = (optNum === q.ans);

      if (!userState[currentExamId]) userState[currentExamId] = { answers: {} };
      userState[currentExamId].answers[q.q_num] = {
        selected: optNum,
        isCorrect: isCorrect
      };
      localStorage.setItem("cbt_user_state_pure_v2", JSON.stringify(userState));

      playBeep(isCorrect);
      renderQuestion();
    }

    function showFeedback(isCorrect, ansNum, explanation) {
      const banner = document.getElementById("feedbackBanner");
      const title = document.getElementById("feedbackTitle");
      const expText = document.getElementById("explanationText");

      banner.style.display = "flex";
      expText.textContent = explanation || "해당 이론의 핵심 출제 포인트를 복습하세요.";

      if (isCorrect) {
        banner.className = "feedback-box correct-box";
        title.innerHTML = '<span style="color: #34d399;">🎉 정답입니다!</span>';
      } else {
        banner.className = "feedback-box wrong-box";
        title.innerHTML = `<span style="color: #fb7185;">❌ 오답입니다 (정답: ${ansNum}번)</span>`;
      }
    }

    function toggleRevealAnswer() {
      const qList = getFilteredQuestions();
      if (qList.length === 0) return;
      const q = qList[currentQIndex];
      selectOption(q.ans);
    }

    function prevQuestion() {
      if (currentQIndex > 0) {
        currentQIndex--;
        renderQuestion();
      }
    }

    function nextQuestion() {
      const qList = getFilteredQuestions();
      if (currentQIndex < qList.length - 1) {
        currentQIndex++;
        renderQuestion();
      }
    }

    function jumpToQuestion(idx) {
      currentQIndex = idx;
      renderQuestion();
    }

    function renderOMRGrid() {
      const grid = document.getElementById("omrGrid");
      grid.innerHTML = "";
      const qList = getFilteredQuestions();
      const examState = userState[currentExamId]?.answers || {};

      qList.forEach((q, idx) => {
        const btn = document.createElement("div");
        const isCurrent = (idx === currentQIndex);
        const ansInfo = examState[q.q_num];

        let cls = "omr-cell";
        if (ansInfo) {
          cls += ansInfo.isCorrect ? " correct" : " wrong";
        }
        if (isCurrent) {
          cls += " current";
        }

        btn.className = cls;
        btn.textContent = q.q_num;
        btn.onclick = () => jumpToQuestion(idx);
        grid.appendChild(btn);
      });

      const answeredCount = Object.keys(examState).length;
      document.getElementById("omrCountBadge").textContent = `${answeredCount} / ${qList.length} 완료`;
    }

    function updateStats() {
      const exam = getCurrentExam();
      if (!exam) return;
      const examState = userState[currentExamId]?.answers || {};
      const answeredKeys = Object.keys(examState);
      
      let correct = 0;
      let wrong = 0;
      answeredKeys.forEach(k => {
        if (examState[k].isCorrect) correct++;
        else wrong++;
      });

      document.getElementById("correctCountText").textContent = correct;
      document.getElementById("wrongCountText").textContent = wrong;
      const totalAnswered = answeredKeys.length;
      const acc = totalAnswered > 0 ? Math.round((correct / totalAnswered) * 100) : 0;
    }

    function toggleMode() {
      currentMode = (currentMode === 'study') ? 'wrong' : 'study';
      document.getElementById("modeBtn").textContent = (currentMode === 'study') ? "1문제씩 풀기" : "오답노트 모드";
      currentQIndex = 0;
      renderQuestion();
    }

    function resetExamProgress() {
      if (confirm("현재 시험지의 모든 풀이 기록을 초기화하시겠습니까?")) {
        userState[currentExamId] = { answers: {} };
        localStorage.setItem("cbt_user_state_pure_v2", JSON.stringify(userState));
        currentQIndex = 0;
        renderQuestion();
      }
    }

    function setupKeyboardShortcuts() {
      window.addEventListener("keydown", (e) => {
        if (['INPUT', 'SELECT', 'TEXTAREA'].includes(e.target.tagName)) return;

        if (e.key >= '1' && e.key <= '5') {
          selectOption(parseInt(e.key));
        } else if (e.key === 'ArrowRight' || e.key === ' ' || e.code === 'Space') {
          e.preventDefault();
          nextQuestion();
        } else if (e.key === 'ArrowLeft') {
          e.preventDefault();
          prevQuestion();
        } else if (e.key === 'Enter') {
          e.preventDefault();
          toggleRevealAnswer();
        }
      });
    }
  </script>
</body>
</html>

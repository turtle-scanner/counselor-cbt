<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>청소년상담사 2급 기출 CBT 문제풀이 (맑은 고딕 대형 글씨)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              400: '#818cf8',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="data.js"></script>
  <style>
    /* 맑은 고딕(Malgun Gothic) 최우선 적용 */

      font-family: 'Malgun Gothic', '맑은 고딕', 'Apple SD Gothic Neo', sans-serif !important;
      letter-spacing: -0.02em;
    }
    
    .q-img-container img {
      width: 100%;
      max-width: 900px;
      height: auto;
      user-select: none;
      filter: invert(0.92) hue-rotate(180deg) contrast(1.25) brightness(1.05);
    }
    
    .custom-scroll::-webkit-scrollbar { width: 8px; height: 8px; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 4px; }
    
    /* When user turns off invert */
    .img-original {
      filter: none !important;
    }
  </style>
</head>
<body class="bg-black text-white min-h-screen flex flex-col selection:bg-brand-500 selection:text-white">

  <!-- TOP NAV -->

      <!-- Brand & Exam Select -->
      <div class="flex items-center gap-3">
        <div class="bg-brand-600 text-white p-2.5 rounded-xl shadow-lg flex items-center justify-center">
          <i class="fa-solid fa-graduation-cap text-2xl"></i>
        </div>
        <div>
          <h1 class="font-black text-xl leading-tight flex items-center gap-2 text-white">
            청소년상담사 2급 CBT
            <span class="text-xs bg-brand-500/20 text-brand-400 font-bold px-2.5 py-0.5 rounded-full border border-brand-500/30">맑은 고딕 대형 글씨 모드</span>
          </h1>
          <div class="flex items-center gap-2 mt-1">
            <select id="examSelect" onchange="changeExam(this.value)" class="text-sm bg-zinc-900 border border-zinc-700 text-white font-bold rounded-lg px-3 py-1.5 focus:ring-2 focus:ring-brand-500 outline-none">
            </select>
            <span id="subjectBadge" class="text-xs bg-amber-950/80 text-amber-300 border border-amber-800/60 font-bold px-2.5 py-1 rounded">
              과목 로딩중...
            </span>
          </div>
        </div>
      </div>

      <!-- Mode & Stats Controls -->
      <div class="flex items-center gap-2.5 flex-wrap">
        
        <!-- Timer -->
        <div class="flex items-center gap-1.5 bg-zinc-900 border border-zinc-800 px-3.5 py-1.5 rounded-lg text-sm font-bold text-zinc-100">
          <i class="fa-regular fa-clock text-brand-400"></i>
          <span id="timerDisplay">00:00</span>
          <button onclick="toggleTimer()" id="timerBtn" class="text-xs ml-1 hover:text-brand-400"><i class="fa-solid fa-pause"></i></button>
        </div>

        <!-- Mode Buttons -->

          <button onclick="setMode('exam')" id="modeExamBtn" class="px-3.5 py-1.5 rounded-lg text-zinc-400 hover:text-white flex items-center gap-1.5">

        </div>

        <!-- Invert Image Toggle Button -->

        <!-- Audio -->

  <!-- MAIN WRAPPER -->

    <!-- LEFT: QUESTION AREA (70%) -->

      <!-- Progress Bar & Top Meta -->
      <div class="bg-zinc-950 border border-zinc-800 rounded-2xl p-4 shadow-sm flex flex-col gap-2.5">
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-3">

            <span class="text-base font-bold text-zinc-400">/ <span id="totalQCountText">100</span>문항</span>

            </span>

        <!-- Zoom / Action Controls -->

          </span>
          <div class="flex items-center gap-2">
            <button onclick="bookmarkQuestion()" id="bookmarkBtn" class="text-xs px-3 py-1.5 rounded-lg bg-zinc-900 border border-zinc-800 hover:text-amber-400 text-zinc-200 flex items-center gap-1.5 font-bold transition-colors">
              <i class="fa-regular fa-star"></i> 북마크
            </button>
            <button onclick="zoomImage(1.15)" class="px-2.5 py-1.5 rounded-lg bg-zinc-900 border border-zinc-800 hover:bg-zinc-800 text-xs flex items-center justify-center font-bold text-zinc-200" title="글자 확대"><i class="fa-solid fa-magnifying-glass-plus mr-1"></i> 확대</button>
            <button onclick="zoomImage(0.85)" class="px-2.5 py-1.5 rounded-lg bg-zinc-900 border border-zinc-800 hover:bg-zinc-800 text-xs flex items-center justify-center font-bold text-zinc-200" title="글자 축소"><i class="fa-solid fa-magnifying-glass-minus mr-1"></i> 축소</button>

        <!-- Answer / Feedback Toast -->

            <div>

              <p id="feedbackDesc" class="text-sm font-semibold text-zinc-300"></p>

          <button onclick="nextQuestion()" class="px-5 py-2.5 bg-zinc-800 text-white border border-zinc-700 rounded-xl text-sm font-bold shadow hover:bg-zinc-700 transition flex items-center gap-1.5">
            다음 문제 (Space) <i class="fa-solid fa-arrow-right"></i>

        </div>

        <!-- Answer Choice Buttons (1, 2, 3, 4, 5) -->
        <div class="mt-5 pt-4 border-t border-zinc-800">

            <span class="text-xs font-bold text-zinc-400 uppercase tracking-wider">정답 마킹 (키보드 1~5 선택)</span>
            <button onclick="toggleRevealAnswer()" id="revealAnsBtn" class="text-sm font-bold text-brand-400 hover:underline flex items-center gap-1.5">

            </button>
            <button onclick="selectOption(2)" id="opt2" class="opt-btn group relative py-4 rounded-2xl border-2 border-zinc-800 bg-zinc-900 hover:border-brand-500 hover:bg-brand-950/50 text-white transition-all font-black text-2xl flex flex-col items-center justify-center shadow-sm">
              <span>②</span>
              <span class="text-xs font-bold text-zinc-400 group-hover:text-brand-400 mt-0.5">Key 2</span>
            </button>
            <button onclick="selectOption(3)" id="opt3" class="opt-btn group relative py-4 rounded-2xl border-2 border-zinc-800 bg-zinc-900 hover:border-brand-500 hover:bg-brand-950/50 text-white transition-all font-black text-2xl flex flex-col items-center justify-center shadow-sm">

            </button>
            <button onclick="selectOption(4)" id="opt4" class="opt-btn group relative py-4 rounded-2xl border-2 border-zinc-800 bg-zinc-900 hover:border-brand-500 hover:bg-brand-950/50 text-white transition-all font-black text-2xl flex flex-col items-center justify-center shadow-sm">
              <span>④</span>
              <span class="text-xs font-bold text-zinc-400 group-hover:text-brand-400 mt-0.5">Key 4</span>

        <div class="flex items-center gap-2">
          <button onclick="resetCurrentExamProgress()" class="text-xs text-zinc-500 hover:text-rose-400 px-3 py-2 font-bold">

        </div>
        <button onclick="nextQuestion()" class="px-7 py-3 bg-brand-600 hover:bg-brand-500 text-white rounded-xl font-bold text-base shadow-lg transition flex items-center gap-2">

    <!-- RIGHT: OMR & SUBJECT NAV (30%) -->

      <!-- OMR Sheet Card -->

        <div class="flex items-center justify-between pb-3 border-b border-zinc-800 mb-3">
          <h3 class="font-black text-base flex items-center gap-2 text-white">
            <i class="fa-solid fa-table-cells text-brand-400"></i> OMR 문항 네비게이터
          </h3>
          <span class="text-xs font-bold text-zinc-400" id="answeredRatio">0 / 100</span>
        </div>

        <!-- Subject Filter Tabs -->
        <div id="subjectTabs" class="flex flex-wrap gap-1.5 mb-3">
        </div>

        <!-- Grid of Questions -->
        <div id="omrGrid" class="grid grid-cols-5 gap-2 overflow-y-auto max-h-[380px] p-1 custom-scroll flex-1">
        </div>

        <!-- OMR Legend -->
        <div class="mt-3 pt-3 border-t border-zinc-800 flex items-center justify-between text-xs font-bold text-zinc-400">
          <span class="flex items-center gap-1"><span class="w-3 h-3 rounded bg-emerald-500 inline-block"></span> 정답</span>
          <span class="flex items-center gap-1"><span class="w-3 h-3 rounded bg-rose-500 inline-block"></span> 오답</span>
          <span class="flex items-center gap-1"><span class="w-3 h-3 rounded bg-brand-500 inline-block"></span> 현재</span>
          <span class="flex items-center gap-1"><span class="w-3 h-3 rounded bg-zinc-900 border border-zinc-700 inline-block"></span> 미풀이</span>
        </div>

      </div>

      <!-- Quick Shortcuts Info -->
      <div class="bg-zinc-950 border border-zinc-800 rounded-2xl p-4 text-xs text-zinc-300">
        <h4 class="font-black text-sm flex items-center gap-1.5 mb-2 text-white">
          <i class="fa-solid fa-keyboard text-brand-400"></i> 키보드 단축키
        </h4>
        <ul class="space-y-1.5 opacity-90 leading-relaxed text-xs text-zinc-300 font-bold">
          <li>• <kbd class="px-2 py-0.5 bg-zinc-800 text-white rounded border border-zinc-700 font-mono">1</kbd> ~ <kbd class="px-2 py-0.5 bg-zinc-800 text-white rounded border border-zinc-700 font-mono">5</kbd> : 정답 마킹</li>
          <li>• <kbd class="px-2 py-0.5 bg-zinc-800 text-white rounded border border-zinc-700 font-mono">Space</kbd> / <kbd class="px-2 py-0.5 bg-zinc-800 text-white rounded border border-zinc-700 font-mono">→</kbd> : 다음 문제</li>
          <li>• <kbd class="px-2 py-0.5 bg-zinc-800 text-white rounded border border-zinc-700 font-mono">←</kbd> : 이전 문제</li>
          <li>• <kbd class="px-2 py-0.5 bg-zinc-800 text-white rounded border border-zinc-700 font-mono">Enter</kbd> : 정답/해설 확인</li>
        </ul>
      </div>

    </aside>

  </main>

  <!-- JAVASCRIPT ENGINE -->
  <script>
    let currentExamId = "2025_1";
    let currentQIndex = 0;
    let currentMode = "study";
    let currentZoom = 1.05;
    let soundEnabled = true;
    let timerSeconds = 0;
    let timerInterval = null;
    let timerPaused = false;
    let activeSubjectFilter = "ALL";
    let isImageInverted = true;

    let userState = JSON.parse(localStorage.getItem("cbt_user_state") || "{}");

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(isCorrect) {
      if (!soundEnabled) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        
        if (isCorrect) {
          osc.type = "sine";
          osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
          osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1);
          gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.35);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.35);
        } else {
          osc.type = "sawtooth";
          osc.frequency.setValueAtTime(180, audioCtx.currentTime);
          gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.25);
        }
      } catch (e) {}
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      const btn = document.getElementById("soundBtn");
      btn.innerHTML = soundEnabled ? '<i class="fa-solid fa-volume-high"></i>' : '<i class="fa-solid fa-volume-xmark text-rose-500"></i>';
    }

    function toggleImageInvert() {
      isImageInverted = !isImageInverted;
      const img = document.getElementById("qImg");
      const text = document.getElementById("invertText");
      if (isImageInverted) {
        img.classList.remove("img-original");
        text.textContent = "종이 다크 ON";
      } else {
        img.classList.add("img-original");
        text.textContent = "종이 화이트 ON";
      }
    }

    function startTimer() {
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        if (!timerPaused) {
          timerSeconds++;
          const mins = String(Math.floor(timerSeconds / 60)).padStart(2, '0');
          const secs = String(timerSeconds % 60).padStart(2, '0');
          document.getElementById("timerDisplay").textContent = `${mins}:${secs}`;
        }
      }, 1000);
    }
    function toggleTimer() {
      timerPaused = !timerPaused;
      const btn = document.getElementById("timerBtn");
      btn.innerHTML = timerPaused ? '<i class="fa-solid fa-play"></i>' : '<i class="fa-solid fa-pause"></i>';
    }

    window.addEventListener("DOMContentLoaded", () => {
      populateExamSelect();
      loadExam(currentExamId);
      startTimer();
      setupKeyboardShortcuts();
    });

    function populateExamSelect() {
      const select = document.getElementById("examSelect");
      select.innerHTML = "";
      if (!window.EXAM_DATA) return;
      Object.keys(window.EXAM_DATA).forEach(id => {
        const opt = document.createElement("option");
        opt.value = id;
        opt.textContent = window.EXAM_DATA[id].title;
        select.appendChild(opt);
      });
      select.value = currentExamId;
    }

    function changeExam(examId) {
      currentExamId = examId;
      currentQIndex = 0;
      activeSubjectFilter = "ALL";
      loadExam(examId);
    }

    function getCurrentExam() {
      return window.EXAM_DATA ? window.EXAM_DATA[currentExamId] : null;
    }

    function getFilteredQuestions() {
      const exam = getCurrentExam();
      if (!exam) return [];
      
      let list = exam.questions;
      if (activeSubjectFilter !== "ALL") {
        list = list.filter(q => q.subject.includes(activeSubjectFilter));
      }
      
      if (currentMode === "wrong") {
        const examState = userState[currentExamId]?.answers || {};
        list = list.filter(q => examState[q.q_num] && !examState[q.q_num].isCorrect);
      }
      return list;
    }

    function loadExam(examId) {
      const exam = getCurrentExam();
      if (!exam) return;

      if (!userState[examId]) {
        userState[examId] = { answers: {}, bookmarks: [] };
      }

      renderSubjectTabs();
      renderQuestion();
      renderOMRGrid();
      updateStats();
    }

    function renderSubjectTabs() {
      const exam = getCurrentExam();
      const container = document.getElementById("subjectTabs");
      container.innerHTML = "";
      
      const allBtn = document.createElement("button");
      allBtn.className = `text-xs px-3 py-1 rounded-lg font-bold ${activeSubjectFilter === 'ALL' ? 'bg-brand-600 text-white' : 'bg-zinc-900 border border-zinc-800 text-zinc-300 hover:text-white'}`;
      allBtn.textContent = "전체";
      allBtn.onclick = () => { activeSubjectFilter = "ALL"; renderSubjectTabs(); renderOMRGrid(); renderQuestion(); };
      container.appendChild(allBtn);

      exam.subjects.forEach(sub => {
        const shortName = sub.split(" ")[0];
        const btn = document.createElement("button");
        btn.className = `text-xs px-3 py-1 rounded-lg font-bold ${activeSubjectFilter === shortName ? 'bg-brand-600 text-white' : 'bg-zinc-900 border border-zinc-800 text-zinc-300 hover:text-white'}`;
        btn.textContent = shortName;
        btn.onclick = () => { activeSubjectFilter = shortName; renderSubjectTabs(); renderOMRGrid(); renderQuestion(); };
        container.appendChild(btn);
      });
    }

    function renderQuestion() {
      const qList = getFilteredQuestions();
      if (qList.length === 0) {
        document.getElementById("currentQNumText").textContent = "-";
        document.getElementById("qImg").src = "";
        document.getElementById("feedbackBanner").classList.add("hidden");
        document.getElementById("qSubjName").textContent = currentMode === 'wrong' ? "틀린 문제가 없습니다! 🎉" : "문항 없음";
        return;
      }

      if (currentQIndex >= qList.length) currentQIndex = qList.length - 1;
      if (currentQIndex < 0) currentQIndex = 0;

      const q = qList[currentQIndex];

      document.getElementById("currentQNumText").textContent = `Q${q.q_num}`;
      document.getElementById("totalQCountText").textContent = qList.length;
      document.getElementById("qSubjName").textContent = q.subject;
      document.getElementById("subjectBadge").textContent = q.subject.split(" ")[0];

      const imgElem = document.getElementById("qImg");
      imgElem.src = q.img;
      if (isImageInverted) imgElem.classList.remove("img-original");
      else imgElem.classList.add("img-original");

      const isBookmarked = (userState[currentExamId]?.bookmarks || []).includes(q.q_num);
      const bmBtn = document.getElementById("bookmarkBtn");
      bmBtn.innerHTML = isBookmarked ? '<i class="fa-solid fa-star text-amber-400"></i> 북마크됨' : '<i class="fa-regular fa-star"></i> 북마크';

      for (let i = 1; i <= 5; i++) {
        const btn = document.getElementById(`opt${i}`);
        btn.className = "opt-btn group relative py-4 rounded-2xl border-2 border-zinc-800 bg-zinc-900 hover:border-brand-500 hover:bg-brand-950/50 text-white transition-all font-black text-2xl flex flex-col items-center justify-center shadow-sm";
      }

      const saved = userState[currentExamId]?.answers[q.q_num];
      const banner = document.getElementById("feedbackBanner");

      if (saved) {
        const chosenBtn = document.getElementById(`opt${saved.selected}`);
        if (saved.isCorrect) {
          chosenBtn.className = "opt-btn py-4 rounded-2xl border-2 border-emerald-500 bg-emerald-950/70 text-emerald-400 font-black text-2xl flex flex-col items-center justify-center ring-4 ring-emerald-500/40 shadow-lg";
          showFeedback(true, q.ans);
        } else {
          chosenBtn.className = "opt-btn py-4 rounded-2xl border-2 border-rose-500 bg-rose-950/70 text-rose-400 font-black text-2xl flex flex-col items-center justify-center ring-4 ring-rose-500/40 shadow-lg";
          if (q.ans >= 1 && q.ans <= 5) {
            const correctBtn = document.getElementById(`opt${q.ans}`);
            correctBtn.className = "opt-btn py-4 rounded-2xl border-2 border-emerald-500 bg-emerald-950/70 text-emerald-400 font-black text-2xl flex flex-col items-center justify-center shadow-md";
          }
          showFeedback(false, q.ans);
        }
      } else {
        banner.classList.add("hidden");
      }

      renderOMRGrid();
      updateStats();
    }

    function selectOption(optNum) {
      const qList = getFilteredQuestions();
      if (qList.length === 0) return;
      const q = qList[currentQIndex];

      const isCorrect = (q.ans === 0) || (optNum === q.ans);

      if (!userState[currentExamId]) userState[currentExamId] = { answers: {}, bookmarks: [] };
      userState[currentExamId].answers[q.q_num] = {
        selected: optNum,
        isCorrect: isCorrect
      };
      localStorage.setItem("cbt_user_state", JSON.stringify(userState));

      playBeep(isCorrect);
      renderQuestion();
    }

    function showFeedback(isCorrect, ansNum) {
      const banner = document.getElementById("feedbackBanner");
      const icon = document.getElementById("feedbackIcon");
      const title = document.getElementById("feedbackTitle");
      const desc = document.getElementById("feedbackDesc");

      banner.classList.remove("hidden");
      if (isCorrect) {
        banner.className = "mt-4 p-4 rounded-2xl flex items-center justify-between transition-all bg-emerald-950/80 border border-emerald-700 text-emerald-100 shadow-lg";
        icon.className = "w-12 h-12 rounded-full flex items-center justify-center text-2xl bg-emerald-500 text-white font-black shadow";
        icon.innerHTML = '<i class="fa-solid fa-check"></i>';
        title.textContent = "정답입니다! 🎉";
        desc.textContent = "훌륭합니다! 다음 문제로 넘어가세요.";
      } else {
        banner.className = "mt-4 p-4 rounded-2xl flex items-center justify-between transition-all bg-rose-950/80 border border-rose-700 text-rose-100 shadow-lg";
        icon.className = "w-12 h-12 rounded-full flex items-center justify-center text-2xl bg-rose-500 text-white font-black shadow";
        icon.innerHTML = '<i class="fa-solid fa-xmark"></i>';
        title.textContent = `오답입니다 (정답: ${ansNum > 0 ? ansNum + '번' : '확인 필요'})`;
        desc.textContent = "틀린 문제는 오답노트에 자동 저장되었습니다.";
      }
    }

    function toggleRevealAnswer() {
      const qList = getFilteredQuestions();
      if (qList.length === 0) return;
      const q = qList[currentQIndex];
      if (q.ans >= 1 && q.ans <= 5) {
        selectOption(q.ans);
      }
    }

    function prevQuestion() {
      if (currentQIndex > 0) {
        currentQIndex--;
        renderQuestion();
      }
    }

    function nextQuestion() {
      const qList = getFilteredQuestions();
      if (currentQIndex < qList.length - 1) {
        currentQIndex++;
        renderQuestion();
      }
    }

    function jumpToQuestion(idx) {
      currentQIndex = idx;
      renderQuestion();
    }

    function bookmarkQuestion() {
      const qList = getFilteredQuestions();
      if (qList.length === 0) return;
      const q = qList[currentQIndex];

      if (!userState[currentExamId].bookmarks) userState[currentExamId].bookmarks = [];
      const bm = userState[currentExamId].bookmarks;
      const idx = bm.indexOf(q.q_num);
      if (idx >= 0) bm.splice(idx, 1);
      else bm.push(q.q_num);

      localStorage.setItem("cbt_user_state", JSON.stringify(userState));
      renderQuestion();
    }

    function renderOMRGrid() {
      const grid = document.getElementById("omrGrid");
      grid.innerHTML = "";
      const qList = getFilteredQuestions();
      const examState = userState[currentExamId]?.answers || {};

      qList.forEach((q, idx) => {
        const btn = document.createElement("button");
        const isCurrent = (idx === currentQIndex);
        const ansInfo = examState[q.q_num];

        let bgClass = "bg-zinc-900 border border-zinc-800 text-zinc-300 hover:bg-zinc-800";
        if (ansInfo) {
          bgClass = ansInfo.isCorrect ? "bg-emerald-600 text-white font-bold border-emerald-500 shadow-sm" : "bg-rose-600 text-white font-bold border-rose-500 shadow-sm";
        }
        if (isCurrent) {
          bgClass += " ring-2 ring-brand-400 ring-offset-2 ring-offset-black scale-105 font-black";
        }

        btn.className = `py-2 rounded-xl text-xs font-bold transition flex items-center justify-center ${bgClass}`;
        btn.textContent = q.q_num;
        btn.onclick = () => jumpToQuestion(idx);
        grid.appendChild(btn);
      });

      const answeredCount = Object.keys(examState).length;
      document.getElementById("answeredRatio").textContent = `${answeredCount} / ${qList.length}`;
    }

    function updateStats() {
      const exam = getCurrentExam();
      if (!exam) return;
      const examState = userState[currentExamId]?.answers || {};
      const answeredKeys = Object.keys(examState);
      const totalAnswered = answeredKeys.length;
      
      let correct = 0;
      let wrong = 0;
      answeredKeys.forEach(k => {
        if (examState[k].isCorrect) correct++;
        else wrong++;
      });

      document.getElementById("correctCountText").textContent = correct;
      document.getElementById("wrongCountText").textContent = wrong;
      document.getElementById("wrongCountNav").textContent = wrong;

      const acc = totalAnswered > 0 ? Math.round((correct / totalAnswered) * 100) : 0;
      document.getElementById("accuracyText").textContent = acc;

      const qList = getFilteredQuestions();
      const progressPercent = qList.length > 0 ? Math.round(((currentQIndex + 1) / qList.length) * 100) : 0;
      document.getElementById("progressBar").style.width = `${progressPercent}%`;
    }

    function setMode(mode) {
      currentMode = mode;
      currentQIndex = 0;

      ['study', 'wrong', 'exam'].forEach(m => {
        const btn = document.getElementById(`mode${m.charAt(0).toUpperCase() + m.slice(1)}Btn`);
        if (m === mode) {
          btn.className = "px-3.5 py-1.5 rounded-lg bg-zinc-800 text-brand-400 font-bold flex items-center gap-1.5";
        } else {
          btn.className = "px-3.5 py-1.5 rounded-lg text-zinc-400 hover:text-white flex items-center gap-1.5";
        }
      });

      renderQuestion();
    }

    function zoomImage(factor) {
      currentZoom *= factor;
      currentZoom = Math.min(Math.max(0.7, currentZoom), 2.5);
      document.getElementById("qImg").style.transform = `scale(${currentZoom})`;
    }
    function resetZoom() {
      currentZoom = 1.05;
      document.getElementById("qImg").style.transform = `scale(1.05)`;
    }

    function resetCurrentExamProgress() {
      if (confirm("정말로 현재 시험지의 모든 풀이 기록을 초기화하시겠습니까?")) {
        userState[currentExamId] = { answers: {}, bookmarks: [] };
        localStorage.setItem("cbt_user_state", JSON.stringify(userState));
        currentQIndex = 0;
        renderQuestion();
      }
    }

    function setupKeyboardShortcuts() {
      window.addEventListener("keydown", (e) => {
        if (['INPUT', 'SELECT', 'TEXTAREA'].includes(e.target.tagName)) return;

        if (e.key >= '1' && e.key <= '5') {
          selectOption(parseInt(e.key));
        } else if (e.key === 'ArrowRight' || e.key === ' ' || e.code === 'Space') {
          e.preventDefault();
          nextQuestion();
        } else if (e.key === 'ArrowLeft') {
          e.preventDefault();
          prevQuestion();
        } else if (e.key === 'Enter') {
          e.preventDefault();
          toggleRevealAnswer();
        }
      });
    }
  </script>
</body>
</html>
